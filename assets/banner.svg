<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bg-grad)" />
  <rect width="1198" height="318" x="1" y="1" rx="19" fill="none" stroke="rgba(0, 217, 255, 0.25)" stroke-width="1.5" />

  <!-- Ambient Decorative Glow Circles -->
  <circle cx="150" cy="80" r="120" fill="#00D9FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="220" r="140" fill="#818CF8" opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Wave Geometry -->
  <path d="M 0,260 Q 300,190 600,240 T 1200,210 L 1200,320 L 0,320 Z" fill="url(#wave-grad)" />
  <path d="M 0,280 Q 350,220 700,270 T 1200,250 L 1200,320 L 0,320 Z" fill="#00D9FF" opacity="0.08" />

  <!-- Grid Pattern Overlay in corner -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="160" />
    <line x1="100" y1="0" x2="100" y2="160" />
    <line x1="150" y1="0" x2="150" y2="160" />
    <line x1="0" y1="50" x2="200" y2="50" />
    <line x1="0" y1="100" x2="200" y2="100" />
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(60, 45)">
    <rect width="210" height="32" rx="16" fill="rgba(0, 217, 255, 0.1)" stroke="rgba(0, 217, 255, 0.4)" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10B981" />
    <text x="32" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Main Title: Rana Sheikh -->
  <text x="60" y="145" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Rana Sheikh</text>

  <!-- Subtitle -->
  <text x="64" y="190" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.3">Full-Stack Mobile Engineer | Flutter &amp; Node.js Specialist</text>

  <!-- Tag Badges Row -->
  <g transform="translate(64, 222)">
    <!-- Tag 1 -->
    <rect width="180" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="90" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 15+ Production Apps</text>
    
    <!-- Tag 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="90" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⭐ 4.8+ Store Ratings</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(390, 0)">
      <rect width="180" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="90" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📦 pub.dev Package Author</text>
    </g>
  </g>

  <!-- Right Decorative Icon Symbol -->
  <g transform="translate(1020, 75)" opacity="0.85">
    <rect width="120" height="120" rx="30" fill="rgba(0, 217, 255, 0.04)" stroke="rgba(0, 217, 255, 0.2)" stroke-width="2" />
    <!-- Flutter bird-style clean geometric representation -->
    <path d="M 35,60 L 65,30 L 85,30 L 45,70 L 85,110 L 65,110 Z" fill="#00D9FF" opacity="0.9" />
    <path d="M 60,65 L 75,50 L 95,50 L 70,75 Z" fill="#38BDF8" opacity="0.9" />
  </g>
</svg>
